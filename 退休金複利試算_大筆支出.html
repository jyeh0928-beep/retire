                            <div className="w-full bg-gradient-to-r from-slate-800 to-slate-700 rounded-xl p-4 text-white shadow-md flex flex-col md:flex-row items-center justify-between gap-4">
                                <div className="flex items-center gap-3">
                                    <div className="bg-white/10 p-2 rounded-lg">
                                        <Icons.Hourglass size={24} className="text-yellow-400" />
                                    </div>
                                    <div>
                                        <p className="text-xs text-slate-300 font-bold uppercase tracking-wider">Life Countdown</p>
                                        <p className="text-sm">
                                            距離 <span className="font-bold text-yellow-400">{maxAge} 歲</span> 目標僅剩：
                                        </p>
                                    </div>
                                </div>
                                <div className="flex gap-4 md:gap-8">
                                    <div className="text-center">
                                        <span className="block text-2xl md:text-3xl font-bold font-mono text-emerald-400">{formatNumber(lifeCountdown.days)}</span>
                                        <span className="text-xs text-slate-400">天 (Days)</span>
                                    </div>
                                    <div className="text-center">
                                        <span className="block text-2xl md:text-3xl font-bold font-mono text-sky-400">{formatNumber(lifeCountdown.weeks)}</span>
                                        <span className="text-xs text-slate-400">週 (Weeks)</span>
                                    </div>
                                    <div className="text-center">
                                        <span className="block text-2xl md:text-3xl font-bold font-mono text-rose-400">{lifeCountdown.years}</span>
                                        <span className="text-xs text-slate-400">年 (Years)</span>
                                    </div>
                                </div>
                            </div>
                        </header>

                        <div className="flex flex-col xl:flex-row gap-6">
                            
                            {/* 左側參數面板 */}
                            <div className="w-full xl:w-[320px] shrink-0 space-y-6 no-print">
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                                    <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2 border-b border-slate-100 pb-4">
                                        <Icons.Calculator size={20} className="text-emerald-500" />
                                        基本參數
                                    </h2>

                                    {/* 生日 */}
                                    <div className="mb-6">
                                        <label className="text-sm font-medium text-slate-700 block mb-2">出生年月日</label>
                                        <input type="date" value={birthDate} onChange={(e) => setBirthDate(e.target.value)} className="w-full bg-slate-50 p-2 rounded-lg border border-slate-200 text-slate-800 text-sm font-mono outline-none focus:ring-2 focus:ring-emerald-500"/>
                                        <div className="mt-3 flex flex-wrap gap-2 text-xs font-medium">
                                            <span className="px-2 py-1 rounded bg-slate-100 text-slate-600">{personInfo.age} 歲</span>
                                            <span className="px-2 py-1 rounded bg-amber-100 text-amber-800">屬{personInfo.zodiac}</span>
                                            <span className="px-2 py-1 rounded bg-indigo-100 text-indigo-800">{personInfo.starSign}</span>
                                        </div>
                                    </div>

                                    {/* 人生進度條 */}
                                    <LifeProgressBar currentAge={personInfo.age} />
                                    
                                    <InputGroup label="退休年齡" value={retireAge} setValue={(val) => { setRetireAge(val); if(val >= maxAge) setMaxAge(val + 5); }} min={personInfo.age + 1} max={85} step={1} suffix=" 歲"/>
                                    <InputGroup label="目前存款" value={initialAmount} setValue={setInitialAmount} min={0} max={10000000} step={10000} prefix="$"/>
                                    <InputGroup label="每月投入" value={monthlyContribution} setValue={setMonthlyContribution} min={0} max={200000} step={1000} prefix="$"/>
                                    <InputGroup label="年化報酬率" value={annualRate} setValue={setAnnualRate} min={1} max={12} step={0.5} suffix=" %"/>
                                </div>

                                {/* 新增：人生重大支出事件簿 (放在左側第二塊) */}
                                <LifeEventsManager 
                                    events={events} 
                                    setEvents={setEvents} 
                                    currentAge={personInfo.age} 
                                    maxAge={maxAge} 
                                />

                                {/* 進階/退休設定 */}
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-20 h-20 bg-amber-50 rounded-bl-full -mr-10 -mt-10 z-0 opacity-50"></div>
                                    <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2 border-b border-slate-100 pb-4 relative z-10">
                                        <Icons.Wallet size={20} className="text-amber-500" />
                                        退休與通膨設定
                                    </h2>

                                    <InputGroup label="退休後月領(現值)" value={monthlyWithdrawal} setValue={setMonthlyWithdrawal} min={0} max={150000} step={1000} prefix="$" color="amber" tooltip="以「現在的物價」估算您退休後想過的生活水準"/>
                                    <InputGroup label="預測至歲數" value={maxAge} setValue={setMaxAge} min={actualRetireAge + 1} max={110} step={1} suffix=" 歲" color="amber"/>
                                    
                                    <div className="my-6 border-t border-slate-100"></div>
                                    
                                    <InputGroup label="預估通膨率" value={inflationRate} setValue={setInflationRate} min={0} max={5} step={0.1} suffix=" %" color="rose" tooltip="長期平均約 2% - 3%"/>
                                    
                                    <div className="flex items-center justify-between mb-2">
                                        <label className="text-sm font-medium text-slate-700 flex items-center gap-1">
                                            退休金隨通膨調整
                                            <div className="group relative">
                                                <Icons.Info size={14} className="text-slate-400 cursor-help" />
                                                <div className="absolute right-0 bottom-full mb-2 hidden group-hover:block w-48 p-2 bg-slate-800 text-white text-xs rounded shadow-lg z-10">
                                                    開啟後，退休後的提領金額會每年依照通膨率增加，以維持購買力。
                                                </div>
                                            </div>
                                        </label>
                                        <div className="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                            <input type="checkbox" name="toggle" id="toggle" className="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer border-slate-300" checked={adjustForInflation} onChange={(e) => setAdjustForInflation(e.target.checked)}/>
                                            <label htmlFor="toggle" className={`toggle-label block overflow-hidden h-5 rounded-full cursor-pointer ${adjustForInflation ? 'bg-emerald-400' : 'bg-slate-300'}`}></label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* 中間圖表與分析 */}
                            <div className="flex-1 space-y-6">
                                {/* 專業評估儀表板 */}
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 no-print">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                                        <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                            <Icons.Shield className="text-indigo-500" size={24} />
                                            專業評估分析
                                        </h2>
                                        <div className="flex bg-slate-100 p-1 rounded-lg">
                                            <button onClick={() => setViewRealValue(false)} className={`px-3 py-1 text-sm rounded-md transition-all ${!viewRealValue ? 'bg-white shadow text-slate-800 font-bold' : 'text-slate-500'}`}>名目金額</button>
                                            <button onClick={() => setViewRealValue(true)} className={`px-3 py-1 text-sm rounded-md transition-all ${viewRealValue ? 'bg-white shadow text-emerald-600 font-bold' : 'text-slate-500'}`}>實質購買力</button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        {/* 1. 財務健康評分 */}
                                        <div className="bg-indigo-50 rounded-xl p-5 border border-indigo-100 flex flex-col items-center justify-center text-center">
                                            <p className="text-indigo-600 font-bold text-sm mb-1">財務健康分數</p>
                                            <div className="text-5xl font-extrabold text-indigo-600 mb-2">{financialScore}</div>
                                            <div className="flex gap-1">
                                                {[...Array(5)].map((_, i) => (
                                                    <div key={i} className={`h-2 w-6 rounded-full ${i < Math.floor(financialScore/20) ? 'bg-indigo-500' : 'bg-indigo-200'}`}></div>
                                                ))}
                                            </div>
                                            <p className="text-xs text-indigo-400 mt-2">
                                                {financialScore >= 80 ? '您的計畫非常穩健' : (financialScore >= 60 ? '計畫尚可，需注意風險' : '建議調整儲蓄計畫')}
                                            </p>
                                        </div>

                                        {/* 2. 缺口分析與建議 */}
                                        <div className={`rounded-xl p-5 border flex flex-col justify-center ${bankruptcyAge ? 'bg-rose-50 border-rose-100' : 'bg-emerald-50 border-emerald-100'}`}>
                                            <p className={`font-bold text-sm mb-2 flex items-center gap-1 ${bankruptcyAge ? 'text-rose-600' : 'text-emerald-600'}`}>
                                                {bankruptcyAge ? <Icons.AlertTriangle size={16}/> : <Icons.Shield size={16}/>}
                                                {bankruptcyAge ? '資金缺口警示' : '資產安全評估'}
                                            </p>
                                            {bankruptcyAge ? (
                                                <>
                                                    <p className="text-sm text-slate-600 mb-1">預計將於 <strong className="text-rose-600">{bankruptcyAge} 歲</strong> 耗盡資產。</p>
                                                    <div className="mt-2 p-3 bg-white rounded-lg border border-rose-100 shadow-sm">
                                                        <p className="text-xs text-slate-500">專業建議</p>
                                                        <p className="text-rose-600 font-bold text-sm">
                                                            建議每月多存 {formatMoneyFull(gapSuggestion)}
                                                        </p>
                                                    </div>
                                                </>
                                            ) : (
                                                <>
                                                    <p className="text-sm text-slate-600 mb-1">恭喜！您的資產足以支持到 <strong className="text-emerald-600">{maxAge} 歲</strong>。</p>
                                                    <div className="mt-2 p-3 bg-white rounded-lg border border-emerald-100 shadow-sm">
                                                        <p className="text-xs text-slate-500">剩餘資產 ({viewRealValue ? '現值' : '名目'})</p>
                                                        <p className="text-emerald-600 font-bold text-lg">
                                                            {formatMoneyFull(viewRealValue ? finalReal : finalNominal)}
                                                        </p>
                                                    </div>
                                                </>
                                            )}
                                        </div>

                                        {/* 3. 通膨衝擊分析 */}
                                        <div className="bg-slate-50 rounded-xl p-5 border border-slate-200 flex flex-col justify-center">
                                            <p className="text-slate-600 font-bold text-sm mb-2 flex items-center gap-1">
                                                <Icons.Eye size={16}/>
                                                通膨衝擊洞察
                                            </p>
                                            <div className="space-y-3 text-sm">
                                                <div className="flex justify-between">
                                                    <span className="text-slate-500">平均通膨率</span>
                                                    <span className="font-mono font-bold">{inflationRate}%</span>
                                                </div>
                                                <div className="flex justify-between items-center">
                                                    <span className="text-slate-500">購買力折損</span>
                                                    <span className="text-xs bg-slate-200 px-2 py-0.5 rounded text-slate-600">
                                                        {(100 * (1 - (finalReal / (finalNominal || 1)))).toFixed(0)}%
                                                    </span>
                                                </div>
                                                <div className="pt-2 border-t border-slate-200 text-xs text-slate-500 leading-relaxed">
                                                    {viewRealValue 
                                                        ? '目前圖表已顯示「實質購買力」，這是扣除通膨後的真實價值。' 
                                                        : '目前顯示「名目金額」。請注意，30年後的100元可能只剩下一半的購買力。'}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* 圖表區域 */}
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-[450px] flex flex-col relative no-print">
                                    <div className="absolute top-6 right-6 z-10 text-xs font-bold px-2 py-1 rounded bg-slate-100 text-slate-500 border border-slate-200">
                                        {viewRealValue ? '顯示模式：實質購買力 (Real)' : '顯示模式：名目金額 (Nominal)'}
                                    </div>
                                    
                                    <div className="flex-1 w-full min-h-0">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <ComposedChart data={chartData} margin={{ top: 20, right: 30, left: 0, bottom: 0 }}>
                                                <defs>
                                                    <linearGradient id="colorTotal" x1="0" y1="0" x2="0" y2="1">
                                                        <stop offset="5%" stopColor={viewRealValue ? "#059669" : "#10b981"} stopOpacity={0.3}/>
                                                        <stop offset="95%" stopColor={viewRealValue ? "#059669" : "#10b981"} stopOpacity={0}/>
                                                    </linearGradient>
                                                </defs>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                <XAxis dataKey="age" tickLine={false} axisLine={false} tick={{fill: '#94a3b8', fontSize: 12}} label={{ value: '年齡', position: 'insideBottomRight', offset: -5, fill: '#94a3b8' }}/>
                                                <YAxis tickFormatter={(value) => `${(value / 1000000).toFixed(1)}M`} tickLine={false} axisLine={false} tick={{fill: '#94a3b8', fontSize: 12}}/>
                                                <Tooltip 
                                                    contentStyle={{ backgroundColor: '#fff', borderRadius: '12px', border: 'none', boxShadow: '0 4px 12px -2px rgb(0 0 0 / 0.15)' }}
                                                    formatter={(value, name) => [formatMoneyFull(value), name === 'eventCost' ? '重大支出' : (viewRealValue ? '實質資產' : '名目資產')]}
                                                    labelFormatter={(label) => `${label} 歲`}
                                                />
                                                <ReferenceLine x={actualRetireAge} stroke="#f59e0b" strokeDasharray="3 3" label={{ value: '退休', fill: '#f59e0b', position: 'insideTopLeft' }} />
                                                
                                                {/* 主資產曲線 */}
                                                <Area 
                                                    type="monotone" 
                                                    dataKey={viewRealValue ? "realTotal" : "nominalTotal"} 
                                                    stroke={viewRealValue ? "#059669" : "#10b981"} 
                                                    fill="url(#colorTotal)" 
                                                    strokeWidth={3}
                                                    animationDuration={800}
                                                />
                                                
                                                {/* 重大支出柱狀圖 (顯示在曲線下方) */}
                                                <Bar dataKey="eventCost" barSize={10} fill="#f43f5e" />
                                            </ComposedChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                                
                                {/* 退休規劃診斷報告書 */}
                                <RetirementReport 
                                    calculationData={calculationData} 
                                    appState={appState} 
                                    personInfo={personInfo}
                                    financialScore={financialScore}
                                    events={events}
                                />

                                {/* 敏感度分析矩陣 (位於報告書下方) */}
                                <SensitivityMatrix appState={appState} events={events} />

                                {/* 公式與原理說明 */}
                                <FormulaExplanation />
                            </div>

                            {/* 右側工具欄 (Calculator + Notepad) */}
                            <div className="w-full xl:w-[280px] shrink-0 no-print">
                                <div className="sticky top-6 space-y-6">
                                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center">
                                        <h3 className="font-bold text-slate-700 mb-4 flex items-center justify-center gap-2">
                                            <Icons.Calculator size={18} />
                                            快速計算
                                        </h3>
                                        <CalculatorWidget />
                                    </div>
                                    <div className="text-center">
                                        <NotepadWidget />
                                    </div>

                                    {/* 智能投資配置建議 */}
                                    <PortfolioWidget annualRate={annualRate} />

                                    {/* 蒙地卡羅模擬 Widget */}
                                    <MonteCarloWidget appState={appState} events={events} />
                                </div>
                            </div>

                        </div>
                        
                        <footer className="mt-12 text-center text-slate-400 text-xs py-4 no-print">
                            <p>本工具採用現金流量折現法 (DCF) 估算。實際投資績效受市場波動影響，本模擬僅供規劃參考。</p>
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
